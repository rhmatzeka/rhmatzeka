.press{animation:press 7s ease-in-out infinite}
@keyframes press{0%,6%,100%{transform:none}2%,3%{transform:translate(6px,6px)}}
@media (prefers-reduced-motion:reduce){.card,.pop,.press,.rise,.hl,.fade,.spin,.nudge{animation:none!important;opacity:1!important;transform:none!important}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
