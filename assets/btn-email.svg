<svg xmlns="http://www.w3.org/2000/svg" width="166" height="72" viewBox="0 0 166 72" role="img" aria-label="EMAIL"><style>
.card{animation:slam .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{from{transform:translate(12px,12px)}to{transform:none}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.press{animation:press 7s ease-in-out infinite}
@keyframes press{0%,6%,100%{transform:none}2%,3%{transform:translate(6px,6px)}}
@media (prefers-reduced-motion:reduce){.card,.pop,.press,.rise,.hl,.fade,.spin,.nudge{animation:none!important;opacity:1!important;transform:none!important}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
