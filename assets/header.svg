<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Rahmat Eka Satria - Web3, AI Agents, Fullstack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#051422"/>
      <stop offset="1" stop-color="#0b1f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orbit { transform-origin: 1000px 170px; animation: spin 26s linear infinite; }
      .orbit2 { transform-origin: 1000px 170px; animation: spin 40s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      .rise { animation: rise 0.9s ease-out both; }
      .rise2 { animation: rise 0.9s 0.25s ease-out both; }
      .rise3 { animation: rise 0.9s 0.5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1000" cy="170" r="230" fill="url(#glow)" class="pulse"/>

    <!-- node network (web3 / agents) -->
    <g class="orbit" stroke="#22d3ee" stroke-opacity="0.35" fill="none">
      <circle cx="1000" cy="170" r="110" stroke-dasharray="4 8"/>
      <circle cx="1110" cy="170" r="7" fill="#22d3ee" fill-opacity="0.9" stroke="none"/>
      <circle cx="890" cy="170" r="5" fill="#2dd4bf" stroke="none"/>
      <circle cx="1000" cy="60" r="4" fill="#a5f3fc" stroke="none"/>
    </g>
    <g class="orbit2" stroke="#2dd4bf" stroke-opacity="0.25" fill="none">
      <circle cx="1000" cy="170" r="160"/>
      <circle cx="1000" cy="330" r="6" fill="#0891b2" stroke="none"/>
      <circle cx="1160" cy="170" r="4" fill="#22d3ee" stroke="none"/>
      <circle cx="887" cy="57" r="5" fill="#2dd4bf" stroke="none"/>
    </g>
    <g transform="translate(1000 170)">
      <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#082f3a" stroke="#22d3ee" stroke-width="2"/>
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#a5f3fc" stroke-width="1.5" class="pulse"/>
    </g>

    <!-- text -->
    <g class="rise">
      <text x="72" y="92" class="mono" font-size="18" fill="#2dd4bf">~/rhmatzeka <tspan fill="#64748b">on</tspan> <tspan fill="#22d3ee">main</tspan> <tspan fill="#94a3b8">❯ whoami</tspan></text>
    </g>
    <g class="rise2">
      <text x="68" y="172" class="sans" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Rahmat Eka Satria</text>
    </g>
    <g class="rise3">
      <text x="72" y="222" class="mono" font-size="20" fill="#cbd5e1">Web3 <tspan fill="#22d3ee">·</tspan> AI Agents <tspan fill="#22d3ee">·</tspan> Fullstack Developer</text>
      <text x="72" y="272" class="mono" font-size="16" fill="#64748b">Informatics @ Universitas Pamulang — Indonesia</text>
      <rect x="530" y="258" width="10" height="18" fill="#22d3ee" class="blink"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
  </g>
</svg>
