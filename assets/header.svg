<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#083344"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="150" y1="130" x2="1050" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="45" r="150" fill="#0891B2" fill-opacity="0.08"/>
  <circle cx="130" cy="245" r="170" fill="#14B8A6" fill-opacity="0.07"/>

  <path d="M120 72C330 18 444 69 600 69C756 69 870 18 1080 72" stroke="url(#line)" stroke-width="1.5" opacity="0.55">
    <animate attributeName="opacity" values="0.25;0.8;0.25" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M120 188C330 242 444 191 600 191C756 191 870 242 1080 188" stroke="url(#line)" stroke-width="1.5" opacity="0.55">
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="4s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="127" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="600" letter-spacing="4">RAHMAT EKA SATRIA</text>
  <rect x="404" y="149" width="392" height="1.5" rx="1" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="184" text-anchor="middle" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" letter-spacing="3">FULLSTACK  -  WEB3  -  AI BUILDER</text>
</svg>
