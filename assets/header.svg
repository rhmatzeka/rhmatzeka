<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="Rahmat Eka Satria - Web3, AI Agents, Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#051422"/>
      <stop offset="1" stop-color="#0b1f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="800" height="440" rx="28"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orbit { transform-origin: 400px 220px; animation: spin 30s linear infinite; }
      .orbit2 { transform-origin: 400px 220px; animation: spin 46s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.5; } }
      .rise { animation: rise 0.9s ease-out both; }
      .rise2 { animation: rise 0.9s 0.25s ease-out both; }
      .rise3 { animation: rise 0.9s 0.5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="800" height="440" fill="url(#bg)"/>
    <rect width="800" height="440" fill="url(#grid)"/>
    <circle cx="400" cy="220" r="300" fill="url(#glow)" class="pulse"/>

    <!-- orbiting nodes behind the text -->
    <g class="orbit" opacity="0.55" fill="none" stroke="#22d3ee" stroke-opacity="0.22">
      <circle cx="400" cy="220" r="190" stroke-dasharray="4 9"/>
      <circle cx="590" cy="220" r="7" fill="#22d3ee" stroke="none"/>
      <circle cx="210" cy="220" r="5" fill="#2dd4bf" stroke="none"/>
      <circle cx="400" cy="30" r="4" fill="#a5f3fc" stroke="none"/>
    </g>
    <g class="orbit2" opacity="0.55" fill="none" stroke="#2dd4bf" stroke-opacity="0.14">
      <circle cx="400" cy="220" r="260"/>
      <circle cx="660" cy="220" r="5" fill="#22d3ee" stroke="none"/>
      <circle cx="216" cy="36" r="6" fill="#0891b2" stroke="none"/>
      <circle cx="584" cy="404" r="5" fill="#2dd4bf" stroke="none"/>
    </g>

    <g text-anchor="middle">
      <g class="rise">
        <g transform="translate(400 92)">
          <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#082f3a" stroke="#22d3ee" stroke-width="2"/>
          <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="none" stroke="#a5f3fc" stroke-width="1.5" class="pulse"/>
        </g>
        <text x="400" y="164" class="mono" font-size="24" fill="#2dd4bf">❯ whoami<tspan fill="#22d3ee" class="blink">▌</tspan></text>
      </g>
      <g class="rise2">
        <text x="400" y="250" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#name)">Rahmat Eka Satria</text>
      </g>
      <g class="rise3">
        <text x="400" y="310" class="mono" font-size="28" fill="#e2e8f0">Web3 <tspan fill="#22d3ee">·</tspan> AI Agents <tspan fill="#22d3ee">·</tspan> Fullstack</text>
        <text x="400" y="360" class="mono" font-size="22" fill="#94a3b8">Informatics @ UNPAM, Indonesia</text>
      </g>
    </g>

    <rect x="1" y="1" width="798" height="438" rx="28" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
